name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # No external services are needed for the test job: unit + e2e tests run
  # with mocked Prisma/Redis/core. These placeholders satisfy config
  # validation. NOT secrets.
  NODE_ENV: test
  DATABASE_URL: postgresql://slipstream:slipstream_local_dev@localhost:5432/slipstream?schema=public
  GITHUB_WEBHOOK_SECRET: ci-test-secret
  REDIS_HOST: ''

jobs:
  build-test:
    name: install → generate → lint → build → test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma validate
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      # The exported OpenAPI document must be regenerated whenever the HTTP
      # surface changes. If the committed openapi.json is stale (the generated
      # file differs from it), this step fails with a non-zero exit.
      - name: OpenAPI drift check
        run: npm run openapi:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
